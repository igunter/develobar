<div id="develobar" style="padding-left:0;">
    <div class="brand" style="background-color: #FFF; padding: 10px;">
        <a href="https://iangunter.co.uk/#extensions" target="_blank" rel="noopener">
            <img class="logo" src="assets/logo.png" alt="Develobar" />
            <img class="icon" src="assets/icon.png" alt="Develobar" />
        </a>
    </div>

    <div class="dropdown">
        <button data-dropdown="screenshot" title="Screenshot">📸 <span class="label">Screenshot</span> <span class="caret">▾</span></button>
        <div class="menu">
            <button data-tool="screenshot" data-option="visible">Visible</button>
            <button data-tool="screenshot" data-option="fullpage">Full Page</button>
            <button data-tool="screenshot" data-option="select">User Select</button>
        </div>
    </div>
    <div class="dropdown">
        <button data-tool="colour-picker" title="Colour">🎨 <span class="label">Colour</span></button>
        <div class="menu panel" data-panel="colour-picker"></div>
    </div>
    <button data-tool="ruler" title="Measure">📏 <span class="label">Measure</span></button>
    <div class="dropdown">
        <button data-tool="copy-css" title="Copy CSS">🧩 <span class="label">Copy CSS</span></button>
        <div class="menu panel css-panel" data-panel="copy-css"></div>
    </div>
    <div class="dropdown">
        <button data-tool="accessibility" title="Accessibility">♿ <span class="label">Accessibility</span></button>
        <div class="menu panel a11y-panel" data-panel="accessibility"></div>
    </div>
    <button data-tool="seo" title="SEO">🔍 <span class="label">SEO</span></button>
    <button data-tool="cookies" title="Cookies">🍪 <span class="label">Cookies</span></button>

    <div class="spacer"></div>

    <button class="close" data-action="close" title="Close Develobar">×</button>
</div>
