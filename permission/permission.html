<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Develobar: allow cookie access</title>
    <link rel="stylesheet" href="permission.css" />
</head>
<body>
    <img class="icon" src="../assets/icon.png" alt="" />
    <h1>Allow cookie access?</h1>
    <p>The Cookies tool needs your permission to read and change cookies for:</p>
    <ul id="sites"></ul>
    <p class="note">Chrome will ask you to confirm. Cookies are only shown to you and never leave your browser. You can remove this access at any time from the Cookies panel.</p>
    <p id="error" class="error" hidden></p>
    <div class="actions">
        <button id="cancel">Cancel</button>
        <button id="allow" class="primary">Allow</button>
    </div>
    <script src="permission.js"></script>
</body>
</html>
